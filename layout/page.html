<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="https://www.organdonationreform.org{{canonical}}">
<meta property="og:site_name" content="Organ Donation Reform">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="https://www.organdonationreform.org{{canonical}}">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="stylesheet" href="/assets/site.css">
<link rel="icon" href="/assets/mark.svg" type="image/svg+xml">
</head>
<body class="{{class}}">

<a class="skip" href="#main">Skip to content</a>

<header class="masthead">
  <div class="wrap">
    <a class="wordmark" href="/">
      <span class="wordmark-main">Organ Donation Reform</span>
      <span class="wordmark-sub">organdonationreform.org</span>
    </a>
    <!-- Link labels are the site's own names for these things, not new ones. -->
    <nav aria-label="Sections">
      <a href="/">Home</a>
      <a href="/timelines/">Timelines</a>
      <a href="/website-misinformation/">Website Misinformation</a>
    </nav>
  </div>
</header>

<main id="main">
{{content}}
</main>

<!-- Navigation only. No prose is written here: the words on this site are the
     site's own, and a footer is where invented copy tends to accumulate. -->
<footer class="footer">
  <div class="wrap">
    <nav class="footer-nav" aria-label="Site">
      <a class="wordmark" href="/">
        <span class="wordmark-main">Organ Donation Reform</span>
        <span class="wordmark-sub">organdonationreform.org</span>
      </a>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/timelines/">Timelines</a></li>
        <li><a href="/website-misinformation/">Website Misinformation</a></li>
      </ul>
    </nav>
  </div>
</footer>

</body>
</html>
